<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Нэр + Лого санал болгогч — Mergen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0d13; --card: #141a26; --line: #232a38;
    --gold: #cfa24d; --ink: #f3efe6; --dim: #8d95a5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.6; min-height: 100vh; }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 50px 6vw 100px; }
  header.top { display: flex; justify-content: space-between; align-items: center; padding: 18px 6vw; border-bottom: 1px solid var(--line); }
  .logo { font-weight: 800; font-size: 17px; display: flex; align-items: center; gap: 7px; }
  header.top a.back { font-size: 13px; color: var(--dim); }

  .hero { text-align: center; margin-bottom: 34px; }
  .hero h1 { font-size: clamp(24px, 4vw, 34px); font-weight: 800; margin-bottom: 10px; }
  .hero p { color: var(--dim); font-size: 15px; }

  .search-box { display: flex; gap: 10px; margin-bottom: 40px; flex-wrap: wrap; }
  .search-box textarea {
    flex: 1; min-width: 240px; background: var(--card); border: 1px solid var(--line); color: var(--ink);
    border-radius: 12px; padding: 14px 16px; font-size: 14px; font-family: inherit; resize: none; min-height: 52px;
  }
  .search-box textarea:focus { outline: none; border-color: var(--gold); }
  .search-box button {
    background: var(--gold); color: #14100a; border: none; padding: 0 26px; border-radius: 12px;
    font-weight: 700; font-size: 14px; cursor: pointer; min-height: 52px;
  }
  .search-box button:disabled { opacity: 0.5; cursor: default; }

  .status { text-align: center; color: var(--dim); font-size: 14px; margin: 30px 0; display: none; }
  .status.show { display: block; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px;
  }
  .mark { width: 58px; height: 58px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 20px; }
  .mark.circle { border-radius: 50%; }
  .mark.rounded-square { border-radius: 16px; }
  .mark.hexagon { clip-path: polygon(25% 5%, 75% 5%, 100% 50%, 75% 95%, 25% 95%, 0% 50%); }
  .card .name { font-weight: 700; font-size: 16px; }
  .card .tagline { font-size: 12.5px; color: var(--dim); min-height: 32px; }
  .card button { background: transparent; border: 1px solid var(--gold); color: var(--gold); padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; width: 100%; }
  .card button:hover { background: var(--gold); color: #14100a; }

  .empty-hint { text-align: center; color: var(--dim); font-size: 14px; padding: 40px 20px; border: 1px dashed var(--line); border-radius: 14px; }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="logo">
    <svg width="18" height="18" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="#cfa24d" stroke-width="1.6"/><circle cx="12" cy="12" r="5.5" fill="none" stroke="#3fada3" stroke-width="1.6"/><circle cx="12" cy="12" r="1.8" fill="#c1573c"/></svg>
    Mergen
  </div>
  <a class="back" href="/">← Нүүр хуудас</a>
</header>

<div class="wrap">
  <div class="hero">
    <h1>Бизнесийнхээ нэр, лого хараахан бэлэн бэ?</h1>
    <p>Санаагаа бичээд, AI-аас нэр болон энгийн лого санал аваарай.</p>
  </div>

  <div class="search-box">
    <textarea id="ideaInput" placeholder="Жишээ нь: гар хийцийн керамик аяга худалдаалдаг жижиг дэлгүүр"></textarea>
    <button id="generateBtn" onclick="generateNames()">Санал болгуулах</button>
  </div>

  <div class="status" id="statusEl"></div>
  <div class="grid" id="resultsGrid"></div>
  <div class="empty-hint" id="emptyHint">Дээрх талбарт бизнесийнхээ санааг товч тайлбарлаад, "Санал болгуулах" дарна уу.</div>
</div>

<script>
  async function generateNames() {
    const idea = document.getElementById('ideaInput').value.trim();
    if (!idea) return;
    const btn = document.getElementById('generateBtn');
    const status = document.getElementById('statusEl');
    const grid = document.getElementById('resultsGrid');
    const emptyHint = document.getElementById('emptyHint');

    btn.disabled = true;
    btn.textContent = 'Уншиж байна...';
    status.className = 'status show';
    status.textContent = 'AI санаагаа боловсруулж байна...';
    grid.innerHTML = '';
    emptyHint.style.display = 'none';

    try {
      const res = await fetch('/api/namegen/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idea }),
      });
      const data = await res.json();
      if (!res.ok) {
        status.textContent = data.error || 'Алдаа гарлаа';
        return;
      }
      status.className = 'status';
      renderResults(data.suggestions);
    } catch (e) {
      status.className = 'status show';
      status.textContent = 'Сүлжээний алдаа гарлаа. Дахин оролдоно уу.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Санал болгуулах';
    }
  }

  function renderResults(suggestions) {
    const grid = document.getElementById('resultsGrid');
    grid.innerHTML = '';
    suggestions.forEach((s) => {
      const card = document.createElement('div');
      card.className = 'card';

      const mark = document.createElement('div');
      mark.className = 'mark ' + s.logo.shape;
      mark.style.background = s.logo.bg;
      mark.style.color = s.logo.accent;
      mark.textContent = s.logo.letters;

      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = s.name;

      const tagline = document.createElement('div');
      tagline.className = 'tagline';
      tagline.textContent = s.tagline;

      const chooseBtn = document.createElement('button');
      chooseBtn.textContent = 'Энэ нэрээр эхлэх';
      chooseBtn.onclick = () => {
        window.location.href = '/dashboard.html?bizname=' + encodeURIComponent(s.name);
      };

      card.appendChild(mark);
      card.appendChild(name);
      card.appendChild(tagline);
      card.appendChild(chooseBtn);
      grid.appendChild(card);
    });
  }

  document.getElementById('ideaInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generateNames(); }
  });
</script>
</body>
</html>
